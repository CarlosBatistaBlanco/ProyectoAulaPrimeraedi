# Perfil de produccion para MySQL / MariaDB
# Activar con: --spring.profiles.active=mysql
# Mantener H2 por defecto cuando este perfil no se active.

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:tecnicsecure}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect

tecnicsecure:
  mail:
    habilitado: ${MAIL_ENABLED:false}
    host: ${MAIL_HOST:smtp.gmail.com}
    remitente: ${MAIL_FROM:no-responder@tecnisecure.com}
