<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat con clientes | TECNISECURE</title>
<link rel="icon" href="../../img/logo/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/validaciones.css">
<link rel="stylesheet" href="../../css/auth.css">
<link rel="stylesheet" href="../../css/panel.css">
</head>
<body class="panel-body" data-rol="empleado">
<div class="panel-layout">

  <aside class="panel-sidebar" id="panelSidebar">
    <a href="../../index.html" class="panel-sidebar__logo logo">
      <img src="../../img/logo/logo-claro.svg" alt="TECNISECURE" class="logo__claro">
      <img src="../../img/logo/logo.svg" alt="TECNISECURE" class="logo__oscuro">
    </a>
<nav class="panel-menu">
    <span class="panel-menu__seccion">Principal</span>
    <a href="index.html" class="panel-menu__item" data-modulo="dashboard"><i class="fa-solid fa-gauge"></i> Dashboard</a>
    <a href="tareas.html" class="panel-menu__item" data-modulo="tareas"><i class="fa-solid fa-list-check"></i> Mis tareas</a>
    <a href="perfil.html" class="panel-menu__item" data-modulo="perfil"><i class="fa-solid fa-user"></i> Mi perfil</a>
    <span class="panel-menu__seccion">Operación</span>
    <a href="ventas.html" class="panel-menu__item" data-modulo="ventas"><i class="fa-solid fa-cash-register"></i> Registrar venta</a>
    <a href="pedidos.html" class="panel-menu__item" data-modulo="pedidos"><i class="fa-solid fa-cart-shopping"></i> Pedidos</a>
    <a href="inventario.html" class="panel-menu__item" data-modulo="inventario"><i class="fa-solid fa-warehouse"></i> Inventario</a>
    <a href="productos.html" class="panel-menu__item" data-modulo="productos"><i class="fa-solid fa-box"></i> Productos</a>
    <a href="soporte.html" class="panel-menu__item" data-modulo="soporte"><i class="fa-solid fa-headset"></i> Soporte</a>
    <a href="chat.html" class="panel-menu__item" data-modulo="chat"><i class="fa-solid fa-comments"></i> Chat clientes</a>
</nav>
  </aside>
  <div class="panel-overlay" id="panelOverlay"></div>

  <div class="panel-contenido">
    <header class="panel-topbar">
      <button class="panel-toggle" id="panelToggle" aria-label="Abrir menú"><i class="fa-solid fa-bars"></i></button>
      <h1 class="panel-topbar__titulo">Chat con clientes</h1>
      <div class="panel-topbar__usuario">
        <button type="button" class="btn-tema" title="Cambiar tema claro/oscuro">
          <i class="fa-solid fa-moon"></i>
        </button>

        <div class="panel-notificaciones">
          <button class="panel-noti-btn" id="botonNotificaciones" aria-label="Notificaciones">
            <i class="fa-solid fa-bell"></i>
            <span class="panel-noti-contador" id="notificacionesContador" style="display:none">0</span>
          </button>
          <div class="panel-noti-dropdown" id="dropdownNotificaciones">
            <div class="panel-noti-dropdown__header">
              <span>Notificaciones</span>
              <a href="#" id="marcarNotificaciones">Marcar todas como leídas</a>
            </div>
            <ul id="listaNotificaciones">
              <li class="vacio">Cargando notificaciones…</li>
            </ul>
          </div>
        </div>

        <span class="panel-topbar__nombre"><span data-nombre-usuario>…</span>
          <small data-rol-usuario></small>
        </span>
        <div class="panel-avatar" data-avatar-usuario>·</div>
        <a href="#" class="panel-logout" title="Cerrar sesión" onclick="cerrarSesionPanel(); return false;">
          <i class="fa-solid fa-right-from-bracket"></i>
        </a>
      </div>
    </header>

    <main class="panel-main">
<div class="panel-box">
  <h2 class="panel-box__titulo"><i class="fa-solid fa-comments"></i> Conversaciones</h2>
  <div class="panel-tabla-wrap">
    <table class="panel-tabla">
      <thead><tr><th>Cliente</th><th>Correo</th><th>Último mensaje</th><th>Estado</th><th>Acción</th></tr></thead>
      <tbody id="tablaChats"><tr><td colspan="5">Cargando…</td></tr></tbody>
    </table>
  </div>
</div>

<div class="panel-box" id="panelConversacion" style="display:none;">
  <h2 class="panel-box__titulo"><i class="fa-solid fa-user"></i> <span id="chatConNombre">Conversación</span></h2>
  <div class="chat-mensajes" id="chatMensajes" data-cliente="" data-rol="asesor"
       style="max-height:420px; overflow-y:auto;"></div>
  <form id="formChat" class="chat-form" style="display:flex; gap:10px; margin-top:14px;">
    <input type="text" id="mensajeChat" placeholder="Escribe tu respuesta…" autocomplete="off"
           style="flex:1;" required>
    <button type="submit" class="btn btn--primario"><i class="fa-solid fa-paper-plane"></i> Enviar</button>
  </form>
</div>
    </main>
  </div>
</div>

<script src="../../js/api.js"></script>
<script src="../../js/validaciones.js"></script>
<script src="../../js/websocket.js"></script>
<script src="../../js/tema.js"></script>
<script src="../../js/panel.js"></script>
<script src="../../js/paginas-panel.js"></script>
</body>
</html>
