<svg width="220" height="60" viewBox="0 0 220 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Escudo -->
  <defs>
    <linearGradient id="gradEscudo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>
  </defs>

  <path d="M30 4 L52 12 V28 C52 42 42 52 30 56 C18 52 8 42 8 28 V12 Z"
        fill="url(#gradEscudo)" stroke="#e6fbff" stroke-width="1.5"/>

  <!-- Lente de cámara dentro del escudo -->
  <circle cx="30" cy="27" r="11" fill="#0a1628"/>
  <circle cx="30" cy="27" r="7.5" fill="#0d3b52"/>
  <circle cx="30" cy="27" r="4" fill="#00e5ff"/>
  <circle cx="27.5" cy="24.5" r="1.3" fill="#ffffff" opacity="0.8"/>

  <!-- Punto rec -->
  <circle cx="41" cy="15" r="2.6" fill="#ff5a36">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <!-- Texto: TECNI / SECURE -->
  <text x="64" y="39" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#eaf6fb">TECNI</text>
  <text x="120" y="39" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#00e5ff">SECURE</text>
</svg>
