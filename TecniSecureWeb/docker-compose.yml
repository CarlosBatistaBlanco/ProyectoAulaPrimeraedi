# Este archivo permite encender la tienda completa en cualquier computador (Windows, macOS
# o Linux) con una sola orden y abrirla en http://localhost:8080. Conecta las carpetas de
# la página web, las fotos subidas y los respaldos para que ningún dato se pierda al reiniciar.

# Servicios que se ponen en marcha para ejecutar la tienda de forma local
services:
  # Caja principal que contiene tanto el servidor como las pantallas visibles de la tienda
  tecnicsecure:
    # Arma la caja usando las instrucciones de construcción ubicadas dentro de la carpeta backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: tecnicsecure-api:2.0.0
    container_name: tecnicsecure
    # Si ocurre un apagón o reinicio del computador, vuelve a encender la tienda automáticamente
    restart: unless-stopped
    # Conecta el puerto local del navegador (8080 por defecto) con la tienda dentro de la caja
    ports:
      - "${APP_PORT:-8080}:8080"
    # Ajustes de arranque: hora de Colombia, seguridad, administrador, correo y asistente virtual
    environment:
      APP_PORT: 8080
      # Activa los ajustes especiales para guardar datos de forma estable dentro del contenedor
      SPRING_PROFILES_ACTIVE: docker
      TZ: America/Bogota
      JPA_DDL_AUTO: update
      UPLOADS_DIR: /app/frontend/uploads
      CORS_ORIGINS: "http://localhost:${APP_PORT:-8080},http://127.0.0.1:${APP_PORT:-8080}"
      # Estas claves se pueden personalizar creando un archivo .env junto a este archivo
      JWT_SECRET: "${JWT_SECRET:-5b3f8d2a91c64e7fb0a4d8e2c6f19b7a3d5e8f2c4b6a9d1e3f7c8b2a5d9e4f6c}"
      ADMIN_CORREO: "${ADMIN_CORREO:-admin@tecnicsecure.com}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-Admin123!}"
      MAIL_ENABLED: "${MAIL_ENABLED:-false}"
      MAIL_HOST: "${MAIL_HOST:-smtp.gmail.com}"
      MAIL_PORT: "${MAIL_PORT:-587}"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_FROM: "${MAIL_FROM:-}"
      # Clave opcional para conectar el chat público con inteligencia artificial externa
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DEEPSEEK_MODEL: "${DEEPSEEK_MODEL:-deepseek-chat}"
    # Espacios compartidos para conservar la página, las fotos subidas, los datos y los respaldos
    volumes:
      # Pantallas de la tienda y carpeta donde se guardan las fotos subidas por los usuarios
      - ./frontend:/app/frontend
      # Espacio protegido para la base de datos: evita daños en discos de Windows y sobrevive a reinicios
      - tecnicsecure-data:/app/data
      # Carpeta donde se depositan las copias de seguridad automáticas accesibles desde el proyecto
      - ./backend/data:/app/respaldos
    # Revisión automática cada 15 segundos para confirmar que la tienda sigue respondiendo bien
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -fsS http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 20

# Espacios de almacenamiento permanente administrados para proteger la información
volumes:
  # Guarda la base de datos de forma segura incluso si se detiene y vuelve a encender la tienda
  tecnicsecure-data:
