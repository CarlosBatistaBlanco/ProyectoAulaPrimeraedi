# Este archivo se activa cuando la tienda funciona empaquetada dentro de un contenedor.
# Ajusta dónde se guarda la base de datos y hace que cada cambio se escriba de inmediato
# y se reconecte solo ante cualquier tropiezo momentáneo del disco, sin perder información.

spring:
  # Ubica el archivo de datos en la carpeta persistente del contenedor para que sobreviva a los reinicios
  datasource:
    url: jdbc:h2:file:/app/data/tecnicsecure;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE;WRITE_DELAY=0
    hikari:
      # Mantiene varias conexiones activas y verifica seguido que sigan sanas para evitar bloqueos
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      validation-timeout: 5000
      keepalive-time: 60000
      # Prueba sencilla que confirma en milisegundos que la base de datos está respondiendo
      connection-test-query: SELECT 1
  # Crea o actualiza tablas nuevas automáticamente al encender el contenedor sin borrar datos previos
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
