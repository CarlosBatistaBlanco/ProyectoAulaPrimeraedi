<!DOCTYPE html>
<!--
  Esta es la pantalla de Mi Perfil dentro del panel del cliente.
  Aquí el comprador puede mantener al día su nombre y teléfono de contacto,
  además de cambiar su contraseña cuando desee reforzar la seguridad de su cuenta.
-->
<html lang="es">
<!-- Datos básicos de la página, diseño del panel, colores y permiso para instalarla en el celular -->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi perfil | TECNISECURE</title>
<link rel="icon" href="../../img/logo/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/validaciones.css">
<link rel="stylesheet" href="../../css/auth.css">
<link rel="stylesheet" href="../../css/panel.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0a1628">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TecniSecure">
<link rel="apple-touch-icon" href="/img/icons/apple-touch-icon.png">
</head>
<body class="panel-body" data-rol="cliente">
<div class="panel-layout">

  <!-- Menú lateral para moverse entre las secciones del panel del cliente -->
  <aside class="panel-sidebar" id="panelSidebar">
    <a href="../../index.html" class="panel-sidebar__logo logo">
      <img src="../../img/logo/logo-claro.svg" alt="TECNISECURE" class="logo__claro">
      <img src="../../img/logo/logo.svg" alt="TECNISECURE" class="logo__oscuro">
    </a>
<nav class="panel-menu">
    <span class="panel-menu__seccion">Mi cuenta</span>
    <a href="index.html" class="panel-menu__item"><i class="fa-solid fa-gauge"></i> Dashboard</a>
    <a href="perfil.html" class="panel-menu__item"><i class="fa-solid fa-user"></i> Mi perfil</a>
    <a href="direcciones.html" class="panel-menu__item"><i class="fa-solid fa-location-dot"></i> Dirección</a>
    <a href="pedidos.html" class="panel-menu__item"><i class="fa-solid fa-box-open"></i> Mis pedidos</a>
    <span class="panel-menu__seccion">Más</span>
    <a href="favoritos.html" class="panel-menu__item"><i class="fa-solid fa-heart"></i> Favoritos</a>
    <a href="chat.html" class="panel-menu__item"><i class="fa-solid fa-comments"></i> Chat con un asesor</a>
    <a href="../../pages/productos.html" class="panel-menu__item"><i class="fa-solid fa-shop"></i> Ir a la tienda</a>
</nav>
  </aside>
  <div class="panel-overlay" id="panelOverlay"></div>

  <div class="panel-contenido">
    <!-- Barra superior del panel con el título de la sección, cambio de tema, notificaciones y datos de la cuenta -->
    <header class="panel-topbar">
      <button class="panel-toggle" id="panelToggle" aria-label="Abrir menú"><i class="fa-solid fa-bars"></i></button>
      <h1 class="panel-topbar__titulo">Mi perfil</h1>
      <div class="panel-topbar__usuario">
        <button type="button" class="btn-tema" title="Cambiar tema claro/oscuro">
          <i class="fa-solid fa-moon"></i>
        </button>

        <div class="panel-notificaciones">
          <button class="panel-noti-btn" id="botonNotificaciones" aria-label="Notificaciones">
            <i class="fa-solid fa-bell"></i>
            <span class="panel-noti-contador" id="notificacionesContador" style="display:none">0</span>
          </button>
          <div class="panel-noti-dropdown" id="dropdownNotificaciones">
            <div class="panel-noti-dropdown__header">
              <span>Notificaciones</span>
              <a href="#" id="marcarNotificaciones">Marcar todas como leídas</a>
            </div>
            <ul id="listaNotificaciones">
              <li class="vacio">Cargando notificaciones…</li>
            </ul>
          </div>
        </div>

        <span class="panel-topbar__nombre"><span data-nombre-usuario>…</span>
          <small data-rol-usuario></small>
        </span>
        <div class="panel-avatar" data-avatar-usuario>·</div>
        <a href="#" class="panel-logout" title="Cerrar sesión" onclick="cerrarSesionPanel(); return false;">
          <i class="fa-solid fa-right-from-bracket"></i>
        </a>
      </div>
    </header>

    <main class="panel-main">
<!-- Bloque con el formulario para editar el nombre, el teléfono y la contraseña del cliente -->
<div class="panel-box">
  <h2 class="panel-box__titulo"><i class="fa-solid fa-user"></i> Mi perfil</h2>
  <form id="formPerfil" class="auth-form" style="max-width:520px;">
    <div class="campo">
      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre" name="nombre" required>
    </div>
    <div class="campo">
      <label for="correo">Correo electrónico</label>
      <input type="email" id="correo" name="correo" disabled>
    </div>
    <div class="campo">
      <label for="telefono">Teléfono</label>
      <input type="tel" id="telefono" name="telefono">
    </div>
    <div class="campo">
      <label for="passwordActual">Contraseña actual (solo si vas a cambiarla)</label>
      <input type="password" id="passwordActual" name="passwordActual" placeholder="••••••••">
    </div>
    <div class="campo">
      <label for="passwordNueva">Nueva contraseña</label>
      <input type="password" id="passwordNueva" name="passwordNueva" placeholder="Mínimo 8 caracteres, 1 mayúscula y 1 número">
    </div>
    <button type="submit" class="btn btn--primario btn--full">
      <i class="fa-solid fa-floppy-disk"></i> Guardar cambios
    </button>
    <p class="form-respuesta" id="respuestaPerfil"></p>
  </form>
</div>
    </main>
  </div>
</div>

<!-- Archivos que le dan funcionamiento interactivo a esta pantalla: carga y guardado del perfil, validaciones y notificaciones -->
<script src="../../js/api.js"></script>
<script src="../../js/validaciones.js"></script>
<script src="../../js/websocket.js"></script>
<script src="../../js/tema.js"></script>
<script src="../../js/panel.js"></script>
<script src="../../js/paginas-panel.js"></script>
</body>
</html>
